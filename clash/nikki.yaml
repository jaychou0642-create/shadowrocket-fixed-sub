mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true
proxies: []
dns:
  enable: true
  listen: '[::]:1053'
  ipv6: true
  cache-algorithm: lru
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.internal'
  - localhost
  - captive.apple.com
  - e.crashlytics.com
  - sequoia.apple.com
  - seed-sequoia.siri.apple.com
  - '*.ls.apple.com'
  - '*.apple.com'
  - '*.icloud.com'
  - '*.icloud.com.cn'
  - '*.icloud-content.com'
  - '*.apple-cloudkit.com'
  - '*.apzones.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#代理&disable-ipv6=true
  - https://8.8.8.8/dns-query#代理&disable-ipv6=true
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  direct-nameserver:
  - system
  direct-nameserver-follow-policy: true
  nameserver-policy:
    +.apple.com: system
    +.icloud.com: system
    +.icloud.com.cn: system
    +.icloud-content.com: system
    +.apple-cloudkit.com: system
    +.apzones.com: system
profile:
  store-selected: true
  store-fake-ip: true
# Proxy providers are defined locally in Nikki. Never commit subscription URLs or tokens.
proxy-groups:
- name: 代理
  type: select
  proxies:
    - 未送中fallback
    - AI手动
    - 除香港手动
  use:
    - 吹雪月订阅
    - 良心云
  exclude-filter: (?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
  url: https://www.gstatic.com/generate_204
  interval: 3600
  lazy: true
- name: 所有节点
  type: select
  use:
    - 吹雪月订阅
    - 良心云
    - 牛逼
    - 魔戒
    - nanmei
  exclude-filter: (?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
  url: https://www.gstatic.com/generate_204
  interval: 3600
  lazy: true
- name: 未送中fallback
  type: fallback
  use:
    - 吹雪月订阅
    - 良心云
  filter: (?i)(🇯🇵|🇸🇬|🇹🇼|🇰🇷|🇺🇸|🇬🇧|🇩🇪|日本|新加坡|台湾|韩国|美国|英国|德国|JP|SG|TW|KR|US|UK|DE)
  exclude-filter: (?i)(🇭🇰|HK|Hong|hong|香港|剩余流量|套餐到期|官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
  timeout: 5000
  max-failed-times: 2
  expected-status: 204
- name: AI手动
  type: select
  use:
    - 吹雪月订阅
    - 良心云
  exclude-filter: (?i)(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
  url: https://www.gstatic.com/generate_204
  interval: 3600
  lazy: true
- name: 除香港手动
  type: select
  use:
    - 吹雪月订阅
    - 良心云
  exclude-filter: (?i)(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
  url: https://www.gstatic.com/generate_204
  interval: 3600
  lazy: true
