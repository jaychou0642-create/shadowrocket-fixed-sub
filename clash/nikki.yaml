mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true
proxies:
  - name: 直连-IPv6优先
    type: direct
    udp: true
    ip-version: ipv6-prefer
dns:
  enable: true
  listen: '[::]:1053'
  ipv6: true
  cache-algorithm: lru
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.internal'
  - localhost
  - captive.apple.com
  - e.crashlytics.com
  - sequoia.apple.com
  - seed-sequoia.siri.apple.com
  - '*.ls.apple.com'
  - '*.apple.com'
  - '*.icloud.com'
  - '*.icloud.com.cn'
  - '*.icloud-content.com'
  - '*.apple-cloudkit.com'
  - '*.apzones.com'
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  nameserver:
  - system
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  direct-nameserver:
  - system
  direct-nameserver-follow-policy: true
  nameserver-policy:
    +.apple.com: system
    +.icloud.com: system
    +.icloud.com.cn: system
    +.icloud-content.com: system
    +.apple-cloudkit.com: system
    +.apzones.com: system
profile:
  store-selected: true
  store-fake-ip: true
# Proxy providers are defined locally in Nikki. Never commit subscription URLs or tokens.
proxy-groups:
# 所有代理直接选择订阅节点，对应小火箭首页 PROXY。
- name: '所有代理'
  type: select
  default-selected: '[良心云] 🇭🇰香港专线04|BGP|流媒体'
  proxies:
  - '未送中'
  - '未送中fallback'
  - '非香港'
  - '香港'
  - '直连-IPv6优先'
  use:
  - 吹雪云
  - 良心云
  exclude-filter: '(?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|有效期|重置|更新|Traffic|Expire|Expiry|Remaining|Reset|Update|Official|Website|Channel|Group|❗)'
- name: 'Green'
  type: select
  default-selected: '未送中'
  proxies:
  - '所有代理'
  - '未送中'
  - '未送中fallback'
  - '非香港'
  - '香港'
  - '直连-IPv6优先'
  use:
  - 良心云
  - 吹雪云
  filter: '^\[良心云\] 🇸🇬新加坡专线04\|BGP\|流媒体$`^\[吹雪云\] 🇯🇵日本•移联02$`^\[吹雪云\] 🇯🇵日本•移联01$`^\[吹雪云\] 🇸🇬新加坡•移联01$`^\[吹雪云\] 🇺🇸美国•移联01$'
- name: '──── 节点分组 ────'
  type: select
  proxies:
  - REJECT
- name: '未送中'
  type: select
  # 当前 Nikki 仅有吹雪云、良心云；暂不引用魔戒的新加坡SG-HY2、韩国KR-HY2。
  use:
  - 吹雪云
  - 良心云
  filter: '^\[吹雪云\] 🇯🇵日本•移联02$`^\[吹雪云\] 🇯🇵日本•移联01$`^\[吹雪云\] 🇸🇬新加坡•移联01$`^\[良心云\] 🇸🇬新加坡专线04\|BGP\|流媒体$`^\[吹雪云\] 🇺🇸美国•移联01$'
  exclude-filter: '(?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|有效期|重置|更新|Traffic|Expire|Expiry|Remaining|Reset|Update|Official|Website|Channel|Group|❗)'
  empty-fallback: REJECT
  default-selected: '[吹雪云] 🇯🇵日本•移联02'
- name: '未送中fallback'
  type: fallback
  # 当前 Nikki 仅有吹雪云、良心云；暂不引用魔戒的新加坡SG-HY2、韩国KR-HY2。
  use:
  - 吹雪云
  - 良心云
  filter: '^\[吹雪云\] 🇯🇵日本•移联02$`^\[吹雪云\] 🇯🇵日本•移联01$`^\[吹雪云\] 🇸🇬新加坡•移联01$`^\[良心云\] 🇸🇬新加坡专线04\|BGP\|流媒体$`^\[吹雪云\] 🇺🇸美国•移联01$'
  exclude-filter: '(?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|有效期|重置|更新|Traffic|Expire|Expiry|Remaining|Reset|Update|Official|Website|Channel|Group|❗)'
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 600
  timeout: 5000
  max-failed-times: 2
  expected-status: 204
  lazy: true
- name: '非香港'
  type: select
  use:
  - 吹雪云
  - 良心云
  empty-fallback: REJECT
  exclude-filter: '(?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|有效期|重置|更新|Traffic|Expire|Expiry|Remaining|Reset|Update|Official|Website|Channel|Group|❗|🇭🇰|HK|Hong|香港|深港|沪港|京港|港)'
- name: '香港'
  type: select
  use:
  - 吹雪云
  - 良心云
  empty-fallback: REJECT
  filter: '(?i)(🇭🇰|HK|Hong|香港|深港|沪港|京港|港)'
  exclude-filter: '(?i)(官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|有效期|重置|更新|Traffic|Expire|Expiry|Remaining|Reset|Update|Official|Website|Channel|Group|❗)'
- name: '──── 服务分流 ────'
