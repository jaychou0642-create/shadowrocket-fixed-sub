mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.internal'
  - localhost
  - captive.apple.com
  - e.crashlytics.com
  - sequoia.apple.com
  - seed-sequoia.siri.apple.com
  - '*.ls.apple.com'
  - '*.apple.com'
  - '*.icloud.com'
  - '*.icloud.com.cn'
  - '*.icloud-content.com'
  - '*.apple-cloudkit.com'
  - '*.apzones.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - system
  direct-nameserver-follow-policy: false
  nameserver-policy:
    +.apple.com: system
    +.icloud.com: system
    +.icloud.com.cn: system
    +.icloud-content.com: system
    +.apple-cloudkit.com: system
    +.apzones.com: system
profile:
  store-selected: true
  store-fake-ip: true
proxy-groups:
- name: 代理
  type: select
  proxies:
  - 未送中fallback
  - AI手动
  - 除香港手动
  include-all-proxies: true
  exclude-filter: (?i)(剩余流量|套餐到期|官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
- name: 未送中fallback
  type: fallback
  include-all-proxies: true
  filter: (新加坡专线04\|BGP\|流媒体|日本专线01\|BGP\|流媒体|日本专线02\|BGP\|流媒体|韩国专线01\|BGP\|流媒体|台湾专线01\|BGP\|流媒体|韩国高速01\|BGP\|流媒体|台湾高速01\|BGP\|流媒体|日本高速01\|CTCU\|0\.5x|新加坡专线03\|BGP\|流媒体)
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: true
  timeout: 5000
  max-failed-times: 2
  expected-status: 204
- name: AI手动
  type: select
  proxies:
  - 未送中fallback
  include-all-proxies: true
  exclude-filter: (?i)(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
- name: 除香港手动
  type: select
  proxies:
  - 未送中fallback
  include-all-proxies: true
  exclude-filter: (?i)(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|官网|网址|导航|群组|频道|客服|订阅|套餐|流量|剩余|到期|过期|重置|更新|Traffic|Expire|Remaining|Reset|Update|Official|Website|Channel|Group|❗)
- name: AI
  type: select
  proxies:
  - 代理
  - 未送中fallback
  - AI手动
  - 除香港手动
