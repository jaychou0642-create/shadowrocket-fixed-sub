name: Sync supplemental AI rules

on:
  schedule:
    # 06:17 Asia/Shanghai; avoid the busiest minute at the top of the hour.
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_ai_rules.py
      - tests/test_sync_ai_rules.py
      - .github/workflows/sync-ai-rules.yml
  pull_request:
    paths:
      - scripts/sync_ai_rules.py
      - tests/test_sync_ai_rules.py
      - .github/workflows/sync-ai-rules.yml

permissions:
  contents: read

# Share the existing profile generator's lock because both jobs publish to main.
concurrency:
  group: shadowrocket-config-sync
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read upstream snapshots
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch master https://github.com/v2fly/domain-list-community.git "$RUNNER_TEMP/ai-source"
          git clone --depth 1 --single-branch --branch main https://github.com/iab0x00/ProxyRules.git "$RUNNER_TEMP/ai-baseline"

      - name: Generate, validate and publish changed rules
        shell: bash
        run: |
          set -euo pipefail
          source_ref=$(git -C "$RUNNER_TEMP/ai-source" rev-parse HEAD)
          baseline_ref=$(git -C "$RUNNER_TEMP/ai-baseline" rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Rebase generation on the latest main without force-pushing.
            git fetch origin main
            git switch --detach origin/main
            python3 -m unittest discover -s tests
            python3 scripts/sync_ai_rules.py \
              --source-dir "$RUNNER_TEMP/ai-source" \
              --source-ref "$source_ref" \
              --baseline-file "$RUNNER_TEMP/ai-baseline/Rule/AI.txt" \
              --baseline-ref "$baseline_ref"
            python3 scripts/sync_ai_rules.py \
              --source-dir "$RUNNER_TEMP/ai-source" \
              --source-ref "$source_ref" \
              --baseline-file "$RUNNER_TEMP/ai-baseline/Rule/AI.txt" \
              --baseline-ref "$baseline_ref" \
              --check
            git add -- rules/AICustom.list
            if git diff --cached --quiet; then
              echo "Supplemental AI rules are already up to date."
              exit 0
            fi
            git diff --cached --stat
            git commit -m "Sync supplemental AI rules"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish did not succeed; retrying against latest main ($attempt/3)."
          done
          echo "Unable to publish supplemental AI rules after three attempts."
          exit 1
